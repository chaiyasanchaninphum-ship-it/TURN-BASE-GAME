<title>Abyssal Ante</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&family=Chonburi&family=Cinzel:wght@700;900&family=Oxanium:wght@500;700;800&display=swap">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<style>
/* Layout: 9:16 portrait cabinet centred on an ambient abyss; combat = relic rack / score box / 4v4 rank arena / fanned hand + thumb controls. */
:root{
  --abyss:#09070d;
  --crypt:#141019;
  --crypt-2:#1d1724;
  --crypt-3:#2a2133;
  --line:#3a2e45;
  --bone:#ece3cf;
  --ash:#9b8fa8;
  --chips:#2fd3ff;
  --mult:#ff3d3d;
  --gold:#e7b04b;
  --hp:#c0283e;
  --block:#8fb4dc;
  --stress:#d7cbff;
  --virtue:#ffd76a;
  --afflict:#ff2f5b;
  --rR:#8d95ab; --rSR:#a46bff; --rSSR:#f0b43c; --rUR:#ff3358;
  --f-title:'Cinzel','Chonburi',serif;
  --f-disp:'Chonburi','Anuphan',serif;
  --f-body:'Anuphan',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-num:'Oxanium','Anuphan',ui-monospace,monospace;
  --emoji:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif;
  --cw:76px;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--abyss);color:var(--bone);font-family:var(--f-body);font-size:14px;line-height:1.45;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#stage{position:relative;height:100%;display:flex;justify-content:center;overflow:hidden}
#amb{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#game{position:relative;height:100%;aspect-ratio:9/16;max-width:100%;overflow:hidden;isolation:isolate;
  background:radial-gradient(120% 70% at 50% 0%,#2a1430 0%,#120c18 45%,var(--abyss) 100%);
  box-shadow:0 0 0 1px #000,0 0 80px rgba(255,40,80,.12)}
#game::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:30;
  background:radial-gradient(130% 90% at 50% 50%,transparent 55%,rgba(0,0,0,.55) 100%)}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}

.scr{position:absolute;inset:0;display:flex;flex-direction:column;z-index:1;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
.scroll{overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;min-height:0}

/* type */
.t-title{font-family:var(--f-title);font-weight:900;letter-spacing:.06em;line-height:1}
.t-disp{font-family:var(--f-disp);font-weight:400;line-height:1.2;text-wrap:balance}
.h2{font-family:var(--f-disp);font-size:17px;line-height:1.25;text-wrap:balance}
.lbl{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ash);font-weight:600}
.muted{color:var(--ash)}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-weight:700}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.col{display:flex;flex-direction:column;gap:8px}
.grow{flex:1;min-width:0}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 14px;border-radius:10px;font-weight:700;font-size:14px;
  background:linear-gradient(180deg,var(--crypt-3),var(--crypt-2));border:1px solid var(--line);box-shadow:0 2px 0 #000,inset 0 1px 0 rgba(255,255,255,.06);transition:transform .08s,filter .15s}
.btn:active{transform:translateY(2px);box-shadow:0 0 0 #000}
.btn:disabled{opacity:.4;cursor:not-allowed;filter:grayscale(.6)}
.btn.blood{background:linear-gradient(180deg,#c42340,#7c0f25);border-color:#ff5672;color:#fff}
.btn.gold{background:linear-gradient(180deg,#f2c35f,#a8701c);border-color:#ffe09a;color:#1d1204}
.btn.chips{background:linear-gradient(180deg,#2fbfff,#0b6b9b);border-color:#8fe4ff;color:#001826}
.btn.ghost{background:transparent;box-shadow:none}
.btn.sm{padding:6px 10px;font-size:12.5px;border-radius:8px}
.btn.xl{padding:14px 18px;font-size:17px;border-radius:14px;font-family:var(--f-disp);font-weight:400}
.btn .e{font-family:var(--emoji);font-style:normal}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;background:var(--crypt-2);border:1px solid var(--line);font-family:var(--f-num);font-weight:700;font-size:12px;white-space:nowrap}
.pill .e{font-family:var(--emoji);font-size:12px}
.tog{display:inline-flex;align-items:center;gap:5px;padding:5px 9px;border-radius:999px;border:1px solid var(--line);background:var(--crypt);font-weight:700;font-size:11.5px;color:var(--ash)}
.tog.on{color:var(--bone);border-color:var(--gold);box-shadow:0 0 10px rgba(231,176,75,.3)}
.panel{background:linear-gradient(180deg,rgba(29,23,36,.92),rgba(20,16,25,.92));border:1px solid var(--line);border-radius:14px;padding:12px}
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:10px;background:var(--crypt);border:1px solid var(--line)}
.seg button{padding:5px 10px;border-radius:7px;font-size:12.5px;font-weight:700;color:var(--ash)}
.seg button.on{background:var(--crypt-3);color:var(--bone)}

/* rarity */
.rt{display:inline-block;font-family:var(--f-num);font-weight:800;font-size:10.5px;padding:0 5px;border-radius:4px;color:#000;line-height:1.5}
.rt-R{background:var(--rR)} .rt-SR{background:var(--rSR)} .rt-SSR{background:var(--rSSR)}
.rt-UR{background:linear-gradient(90deg,#ff3358,#ff9a3c,#ffe76a,#4dffb5,#4dc3ff,#b066ff,#ff3358);background-size:300% 100%;animation:rb 3s linear infinite}
.rt-common{background:#8d95ab}.rt-uncommon{background:#4fc48a}.rt-rare{background:#ff5d6c}.rt-mythic{background:linear-gradient(90deg,#ff3358,#ffe76a,#4dc3ff,#b066ff,#ff3358);background-size:300% 100%;animation:rb 3s linear infinite}
@keyframes rb{to{background-position:300% 0}}

/* portraits */
.art{position:relative;overflow:hidden;border-radius:10px;background:#000;flex:none}
.art svg{display:block;width:100%;height:100%}
.fr-R{box-shadow:0 0 0 2px var(--rR)} .fr-SR{box-shadow:0 0 0 2px var(--rSR)} .fr-SSR{box-shadow:0 0 0 2px var(--rSSR),0 0 14px rgba(240,180,60,.35)}
.fr-UR{box-shadow:0 0 0 2px var(--rUR),0 0 18px rgba(255,51,88,.5)}
.stars{color:var(--gold);font-size:10px;letter-spacing:-1px;white-space:nowrap}
.stars s{color:#4b3f57;text-decoration:none}

/* ===== COMBAT ===== */
#scr-combat{padding-block:6px 8px;gap:6px}
.cbar{display:flex;align-items:center;gap:6px;font-size:11.5px;min-height:24px}
.cbar .blind{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--afflict);font-weight:700}
.rack{display:flex;gap:5px;justify-content:center;min-height:56px}
.rslot{position:relative;width:calc((100% - 30px)/6);max-width:54px;aspect-ratio:1;border-radius:10px;border:1px dashed var(--line);background:rgba(0,0,0,.3);display:grid;place-items:center;padding:0}
.rslot.has{border:1px solid var(--line);background:radial-gradient(circle at 40% 30%,var(--rc2,#3a2a48),var(--rc1,#16101c));box-shadow:inset 0 0 0 1px rgba(255,255,255,.05)}
.rslot .g{font-family:var(--emoji);font-size:24px;line-height:1;filter:drop-shadow(0 2px 2px #000)}
.rslot.fire{animation:relicPop .42s cubic-bezier(.2,1.6,.4,1);box-shadow:0 0 0 2px var(--gold),0 0 22px rgba(231,176,75,.7)}
.rslot .ed{position:absolute;inset:0;border-radius:10px;pointer-events:none}
.rslot .trig{position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);font-family:var(--f-num);font-weight:800;font-size:10px;padding:0 4px;border-radius:4px;white-space:nowrap;opacity:0}
.rslot.fire .trig{opacity:1}
@keyframes relicPop{0%{transform:scale(1)}35%{transform:scale(1.32) rotate(-6deg)}70%{transform:scale(.94) rotate(3deg)}100%{transform:scale(1)}}
.ed-foil{background:linear-gradient(115deg,transparent 30%,rgba(120,220,255,.35) 45%,transparent 60%);background-size:250% 100%;animation:sheen 2.6s linear infinite}
.ed-holo{background:linear-gradient(115deg,rgba(255,60,120,.18),rgba(60,200,255,.18),rgba(255,230,80,.18));mix-blend-mode:screen}
.ed-poly{background:conic-gradient(from 0deg,rgba(255,0,90,.22),rgba(255,200,0,.22),rgba(0,255,160,.22),rgba(0,140,255,.22),rgba(200,0,255,.22),rgba(255,0,90,.22));animation:spin 6s linear infinite;mix-blend-mode:screen}
.ed-neg{background:rgba(20,0,40,.55);mix-blend-mode:difference;box-shadow:inset 0 0 0 2px #b38cff}
@keyframes sheen{to{background-position:-250% 0}}
@keyframes spin{to{filter:hue-rotate(360deg)}}

.score{position:relative;border-radius:14px;border:1px solid #4a2a3a;background:linear-gradient(180deg,#160c14,#0d080f);padding:6px 8px 7px;overflow:hidden}
#flameCv{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.score>*:not(canvas){position:relative}
.hand-name{display:flex;justify-content:space-between;align-items:baseline;gap:6px;font-size:12px;min-height:18px}
.hand-name b{font-family:var(--f-disp);font-weight:400;font-size:14px;color:var(--bone)}
.eq{display:grid;grid-template-columns:1fr auto 1fr auto 1.25fr;gap:5px;align-items:center;margin-top:3px}
.box{border-radius:9px;padding:3px 6px;text-align:center;font-family:var(--f-num);font-weight:800;font-size:20px;line-height:1.25;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.box.chips{background:linear-gradient(180deg,#0aa9e6,#05608a);color:#e9fbff;box-shadow:0 0 14px rgba(47,211,255,.35),inset 0 -3px 0 rgba(0,0,0,.25)}
.box.mult{background:linear-gradient(180deg,#ff4a3a,#a3101c);color:#fff2ee;box-shadow:0 0 14px rgba(255,61,61,.4),inset 0 -3px 0 rgba(0,0,0,.25)}
.box.total{background:#000;border:1px solid #5a3b2a;color:var(--gold);text-shadow:0 0 12px rgba(231,176,75,.6)}
.box.bump{animation:bump .22s ease}
@keyframes bump{40%{transform:scale(1.18)}}
.op{font-family:var(--f-num);font-weight:800;font-size:18px;color:var(--ash)}

.arena{position:relative;flex:1;min-height:180px;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;border-radius:14px;padding-bottom:4px;overflow:hidden;
  background:radial-gradient(38% 30% at 8% 16%,rgba(255,130,50,.22),transparent 70%),radial-gradient(38% 30% at 92% 16%,rgba(255,130,50,.22),transparent 70%),
  linear-gradient(180deg,rgba(0,0,0,0) 0%,rgba(0,0,0,0) 62%,rgba(60,20,40,.35) 63%,rgba(0,0,0,.7) 100%),
  repeating-linear-gradient(90deg,rgba(255,255,255,.025) 0 1px,transparent 1px 34px),repeating-linear-gradient(0deg,rgba(255,255,255,.02) 0 1px,transparent 1px 26px)}
.arena::before,.arena::after{content:"🔥";position:absolute;top:8%;font-family:var(--emoji);font-size:18px;filter:drop-shadow(0 0 10px rgba(255,140,60,.9));animation:flick 1.6s ease-in-out infinite}
.arena::before{left:7%}.arena::after{right:7%;animation-delay:.5s}
@keyframes flick{50%{transform:scale(1.15) translateY(-1px);opacity:.8}}
.ranks{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) 6px repeat(4,minmax(0,1fr));gap:3px;align-items:end}
.divider{align-self:stretch;background:linear-gradient(180deg,transparent,rgba(255,61,61,.4),transparent);width:2px;justify-self:center}
.unit{position:relative;display:flex;flex-direction:column;align-items:stretch;gap:2px;min-width:0;padding:0;text-align:left;transition:transform .18s}
.unit .intent{height:22px;display:flex;align-items:center;justify-content:center;gap:2px;font-family:var(--f-num);font-weight:800;font-size:11px;white-space:nowrap}
.unit .intent .e{font-family:var(--emoji);font-size:13px}
.unit .pt{position:relative;aspect-ratio:3/4;max-width:100%;border-radius:8px;overflow:hidden;background:#000}
.unit .pt svg{display:block;width:100%;height:100%}
.unit .rk{position:absolute;left:2px;top:1px;font-family:var(--f-num);font-weight:800;font-size:10px;color:var(--bone);text-shadow:0 1px 2px #000}
.unit .blk{position:absolute;right:2px;top:2px;min-width:18px;height:18px;padding:0 3px;border-radius:9px 9px 9px 2px;background:var(--block);color:#06121f;font-family:var(--f-num);font-weight:800;font-size:10.5px;display:grid;place-items:center}
.unit .tagv{position:absolute;inset:auto 0 0 0;font-size:9px;font-weight:700;text-align:center;padding:1px 0;letter-spacing:.02em}
.unit .tagv.v{background:linear-gradient(90deg,transparent,rgba(255,215,106,.85),transparent);color:#2b1a00}
.unit .tagv.a{background:linear-gradient(90deg,transparent,rgba(255,47,91,.85),transparent);color:#fff}
.unit .tagv.dd{background:linear-gradient(90deg,transparent,rgba(0,0,0,.9),transparent);color:#ff6b80}
.unit .bar{height:5px;border-radius:3px;background:#000;overflow:hidden;position:relative}
.unit .bar i{position:absolute;inset:0 auto 0 0;display:block}
.unit .bar.hp i{background:linear-gradient(90deg,#8b1428,var(--hp))}
.unit .bar.st{height:4px} .unit .bar.st i{background:linear-gradient(90deg,#8d7bd6,var(--stress))}
.unit .bar.st.hi i{background:linear-gradient(90deg,#ff2f5b,#ffb3c2)}
.unit .hpn{font-family:var(--f-num);font-weight:700;font-size:9.5px;color:var(--ash);text-align:center;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.unit .sts{display:flex;flex-wrap:wrap;gap:1px;justify-content:center;min-height:13px}
.unit .sts span{font-size:9px;font-family:var(--f-num);font-weight:700;line-height:1.2;padding:0 2px;border-radius:3px;background:rgba(0,0,0,.6);white-space:nowrap}
.unit.dead{opacity:.28;filter:grayscale(1)}
.unit.tgt .pt{box-shadow:0 0 0 2px var(--mult),0 0 14px rgba(255,61,61,.7)}
.unit.tgt::before{content:"▼";position:absolute;top:-14px;left:50%;transform:translateX(-50%);color:var(--mult);font-size:11px;animation:bob 1s ease-in-out infinite}
.unit.reach .pt{box-shadow:0 0 0 2px rgba(255,61,61,.45)}
.unit.owner .pt{box-shadow:0 0 0 2px var(--chips),0 0 12px rgba(47,211,255,.6)}
.unit.act{transform:translateY(-6px) scale(1.06)}
.unit.hitk{animation:hitk .3s ease}
@keyframes hitk{30%{transform:translateX(5px) rotate(3deg);filter:brightness(2.2)}60%{transform:translateX(-3px)}}
@keyframes bob{50%{transform:translate(-50%,3px)}}
.alog{text-align:center;font-size:12px;min-height:18px;color:var(--ash);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.handzone{position:relative;height:calc(var(--cw)*1.42 + 34px);flex:none}
.hand{position:absolute;inset:0}
.card{position:absolute;bottom:0;left:50%;width:var(--cw);height:calc(var(--cw)*1.42);margin-left:calc(var(--cw)/-2);border-radius:9px;padding:0;
  transform-origin:50% 140%;transition:transform .2s cubic-bezier(.2,.9,.3,1.2),filter .2s;text-align:left}
.card .face{position:absolute;inset:0;border-radius:9px;overflow:hidden;display:flex;flex-direction:column;
  background:linear-gradient(180deg,#2a2230,#16111b);border:1.5px solid var(--elc,#555);box-shadow:0 4px 10px rgba(0,0,0,.6)}
.card .top{height:38%;position:relative;background:radial-gradient(circle at 50% 35%,var(--elc2,#444),#0c080f 80%)}
.card .top svg{position:absolute;inset:0;width:100%;height:100%;opacity:.95}
.card .cost{position:absolute;left:-5px;top:-5px;width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe6a0,#c07a12);color:#2a1500;border:1.5px solid #000;font-family:var(--f-num);font-weight:800;font-size:13px;display:grid;place-items:center;z-index:3}
.card .cost.up{background:radial-gradient(circle at 35% 30%,#b4ff9a,#2f9a32)}
.card .cost.bad{background:radial-gradient(circle at 35% 30%,#ff9aa8,#a01026);color:#fff}
.card .nm{font-weight:700;font-size:10px;line-height:1.15;padding:3px 4px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .nm.up{color:#9dff8a}
.card .ds{font-size:8.6px;line-height:1.22;padding:1px 4px;color:#d9cfe2;flex:1;overflow:hidden}
.card .ds b{color:var(--chips)} .card .ds i{color:var(--mult);font-style:normal;font-weight:700}
.card .pips{display:flex;justify-content:space-between;padding:0 4px 3px;font-size:7px;letter-spacing:-.5px;color:#6d6080}
.card .pips .on{color:var(--chips)} .card .pips .on2{color:var(--mult)}
.card .typ{position:absolute;right:3px;top:3px;font-size:8px;font-weight:700;padding:0 4px;border-radius:4px;background:rgba(0,0,0,.65)}
.card .own{position:absolute;right:3px;bottom:3px;width:20px;height:20px;border-radius:5px;overflow:hidden;border:1px solid rgba(255,255,255,.3)}
.card .own svg{width:100%;height:100%;display:block}
.card .edv{position:absolute;inset:0;pointer-events:none;border-radius:9px}
.card.sel{filter:drop-shadow(0 0 10px rgba(47,211,255,.8))}
.card.nope .face{filter:grayscale(.7) brightness(.55)}
.card.ghost{opacity:.0;pointer-events:none}
.card.static{position:relative;left:auto;bottom:auto;margin:0;transform:none!important}
.played{position:absolute;left:0;right:0;top:-6px;display:flex;justify-content:center;gap:3px;pointer-events:none;z-index:5}
.played .mini{width:26px;height:36px;border-radius:5px;border:1.5px solid var(--elc);background:linear-gradient(180deg,var(--elc2),#100b14);display:grid;place-items:center;font-family:var(--emoji);font-size:12px;transition:transform .15s}
.played .mini.lit{transform:translateY(-8px) scale(1.25);box-shadow:0 0 12px var(--elc)}
.cdetail{position:absolute;left:0;right:0;bottom:calc(var(--cw)*1.65 + 44px);z-index:20;display:flex;justify-content:center;pointer-events:none}
.cdetail .inner{pointer-events:auto;max-width:330px;background:rgba(14,10,18,.96);border:1px solid var(--line);border-radius:12px;padding:8px 10px;display:flex;gap:10px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.6)}

.ctrl{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;flex:none}
.orb{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-num);font-weight:800;font-size:18px;color:#fff;
  background:radial-gradient(circle at 35% 30%,#ff9a6a,#c2203a 55%,#3a0612);box-shadow:0 0 18px rgba(255,61,61,.55),inset 0 -4px 8px rgba(0,0,0,.5);border:2px solid #000}
.orb.empty{background:radial-gradient(circle at 35% 30%,#6d5a66,#2a1e26 60%,#120a10);box-shadow:none;color:var(--ash)}
.piles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.pile{display:flex;flex-direction:column;align-items:center;font-size:9.5px;color:var(--ash);padding:2px 0;border-radius:8px;border:1px solid var(--line);background:var(--crypt);min-width:0}
.pile b{font-family:var(--f-num);font-size:14px;color:var(--bone)}
.endbtn{min-width:96px;height:50px;border-radius:14px;font-family:var(--f-disp);font-size:14px;line-height:1.1;text-align:center;padding:4px 10px}

/* ===== MAP ===== */
.mapwrap{position:relative;flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;border-radius:14px;border:1px solid var(--line);
  background:radial-gradient(80% 40% at 50% 0%,rgba(255,51,88,.18),transparent),linear-gradient(180deg,#120b16,#0b080e)}
.map{position:relative;width:100%}
.map svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.node{position:absolute;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;display:grid;place-items:center;font-family:var(--emoji);font-size:19px;
  background:radial-gradient(circle at 40% 35%,#3b2f45,#140f19);border:2px solid #4a3c57;box-shadow:0 3px 0 #000;padding:0;transition:transform .15s}
.node.boss{width:62px;height:62px;margin:-31px 0 0 -31px;font-size:30px;border-color:var(--afflict);box-shadow:0 0 22px rgba(255,47,91,.5)}
.node.done{opacity:.35;filter:grayscale(1)}
.node.cur{border-color:var(--chips);box-shadow:0 0 0 3px rgba(47,211,255,.35)}
.node.next{border-color:var(--gold);animation:nodePulse 1.1s ease-in-out infinite}
.node.next:hover{transform:scale(1.12)}
.node:disabled{cursor:default}
@keyframes nodePulse{50%{box-shadow:0 0 0 6px rgba(231,176,75,.25),0 0 18px rgba(231,176,75,.6)}}

/* ===== overlays ===== */

    daily:{key:'',best:0,claimed:'',hist:[],tries:0},rush:{best:0,runs:0}};
}
let META=defMeta(),RUN=null;
function mergeMeta(m){
  const d=defMeta(),o=Object.assign(d,m||{});
  o.pity=Object.assign(defMeta().pity,(m&&m.pity)||{});
  o.arena=Object.assign(defMeta().arena,(m&&m.arena)||{});
  o.stats=Object.assign(defMeta().stats,(m&&m.stats)||{});
  o.best=Object.assign(defMeta().best,(m&&m.best)||{});
  o.daily=Object.assign(defMeta().daily,(m&&m.daily)||{});
  o.rush=Object.assign(defMeta().rush,(m&&m.rush)||{});
  Object.keys(o.owned).forEach(id=>{if(!HERO_MAP[id]) delete o.owned[id]});
  if(!Object.keys(o.owned).length) o.owned=defMeta().owned;
  o.squad=(o.squad||[]).filter(id=>o.owned[id]).slice(0,4);
  Object.keys(o.owned).forEach(id=>{if(o.squad.length<4&&!o.squad.includes(id)) o.squad.push(id)});
  Object.keys(o.vault).forEach(id=>{if(!RELICS[id]) delete o.vault[id]});
  if(o.startRelic&&!o.vault[o.startRelic]) o.startRelic=null;
  if(![1,2].includes(o.speed)) o.speed=1;
  return o;
}

/* ---------- AUDIO ---------- */
const SFX={ctx:null,master:null,last:{},
  init(){
    if(this.ctx){if(this.ctx.state==='suspended') this.ctx.resume();return}
    try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC) return;this.ctx=new AC();
      this.master=this.ctx.createGain();this.master.gain.value=.3;
      const comp=this.ctx.createDynamicsCompressor();this.master.connect(comp);comp.connect(this.ctx.destination)}catch(e){this.ctx=null}
  },
  tone(f,d,type='sine',v=.2,f2=null,delay=0,dest=null){
    const c=this.ctx,t=c.currentTime+delay,o=c.createOscillator(),g=c.createGain();
    o.type=type;o.frequency.setValueAtTime(f,t);if(f2) o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+d);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g);g.connect(dest||this.master);o.start(t);o.stop(t+d+.05);
  },
  noise(d,v=.2,ff=2000,delay=0,type='lowpass',q=1){
    const c=this.ctx,t=c.currentTime+delay,len=Math.max(1,Math.floor(c.sampleRate*d)),buf=c.createBuffer(1,len,c.sampleRate),a=buf.getChannelData(0);
    for(let i=0;i<len;i++) a[i]=(Math.random()*2-1)*Math.pow(1-i/len,1.5);
    const s=c.createBufferSource();s.buffer=buf;const f=c.createBiquadFilter();f.type=type;f.frequency.value=ff;f.Q.value=q;
    const g=c.createGain();g.gain.value=v;s.connect(f);f.connect(g);g.connect(this.master);s.start(t);
  },
  play(n,p=0){
    if(META.muted||!this.ctx) return;
    const now=performance.now();if(this.last[n]&&now-this.last[n]<35&&!['chime','tick'].includes(n)) return;this.last[n]=now;
    const semi=x=>Math.pow(2,x/12);
    try{switch(n){
      case 'ui': this.tone(520,.06,'triangle',.12);break;
      case 'deny': this.tone(180,.12,'square',.1,120);break;
      case 'card': this.noise(.09,.18,3000,0,'bandpass',2);this.tone(660,.07,'triangle',.08,880);break;
      case 'draw': this.noise(.05,.08,4500,0,'highpass');break;
      case 'tick': this.tone(440*semi(p),.07,'square',.06);break;
      case 'chime': {const f=523*semi(p*2);this.tone(f,.32,'triangle',.16);this.tone(f*2,.22,'sine',.07,null,.02);this.tone(f*1.5,.18,'sine',.05,null,.05);break}
      case 'mult': this.tone(330*semi(p),.18,'sawtooth',.1,660*semi(p));break;
      case 'xmult': this.tone(220*semi(p),.4,'sawtooth',.14,880*semi(p));this.noise(.3,.12,1800);break;
      case 'hit': this.noise(.12,.22,1400);this.tone(140,.12,'square',.08,60);break;
      case 'big': this.noise(.5,.35,900);this.tone(90,.6,'sawtooth',.2,30);this.tone(55,.8,'sine',.25,30);break;
      case 'block': this.tone(900,.08,'square',.06);this.noise(.1,.1,5000,0,'highpass');break;
      case 'heal': [523,659,784].forEach((f,i)=>this.tone(f,.3,'sine',.1,null,i*.06));break;
      case 'stress': this.tone(110,.5,'sawtooth',.1,98);this.tone(117,.5,'sawtooth',.1,104);break;
      case 'enemy': this.noise(.18,.2,700);this.tone(90,.2,'square',.12,50);break;
      case 'coin': this.tone(988,.06,'square',.06);this.tone(1319,.14,'square',.06,null,.06);break;
      case 'virtue': [261,329,392,523,659].forEach((f,i)=>this.tone(f,1.6,'sine',.09,null,i*.09));this.tone(1046,1.2,'triangle',.06,null,.5);break;
      case 'afflict': [110,116.5,155.6].forEach(f=>this.tone(f,1.4,'sawtooth',.11,f*.7));this.noise(1,.15,600);break;
      case 'drone': this.tone(55,2.5,'sawtooth',.12,50);this.tone(82,2.5,'sine',.1,80);break;
      case 'shatter': this.noise(.7,.3,6000,0,'highpass');[1760,2349,3136].forEach((f,i)=>this.tone(f,.4,'triangle',.05,f*.6,i*.03));break;
      case 'rR': this.tone(523,.2,'triangle',.12);break;
      case 'rSR': [523,659,784].forEach((f,i)=>this.tone(f,.25,'triangle',.1,null,i*.07));break;
      case 'rSSR': [523,659,784,1046,1318].forEach((f,i)=>this.tone(f,.3,'square',.07,null,i*.07));break;
      case 'rUR': [392,523,659,784,1046,1318,1568,2093].forEach((f,i)=>this.tone(f,.45,'sawtooth',.06,null,i*.06));this.noise(1,.18,7000,.3,'highpass');break;
      case 'win': [392,523,659,784,1046].forEach((f,i)=>this.tone(f,.35,'triangle',.11,null,i*.1));break;
      case 'lose': [392,311,262,196].forEach((f,i)=>this.tone(f,.6,'sawtooth',.08,f*.9,i*.22));break;
      case 'step': this.noise(.08,.12,900,0,'bandpass',3);break;
      case 'ult': [196,247,294,392,494,587,784].forEach((f,i)=>this.tone(f,.55,'sawtooth',.07,f*1.5,i*.035));this.noise(.9,.3,3000,.25);this.tone(60,1.1,'sine',.35,30,.25);break;
      case 'ultready': [1318,1760,2637].forEach((f,i)=>this.tone(f,.25,'triangle',.06,null,i*.05));break;
      case 'boss': this.tone(41,2.2,'sawtooth',.25,30);this.tone(62,2,'sine',.3,40);this.noise(1.6,.3,500);[0,.5,1].forEach(d=>this.tone(49,.5,'sine',.4,30,d));break;
    }}catch(e){}
  }
};

/* ---------- BGM: generative dark ambience (drone + minor-scale bells; heartbeat on bosses) ---------- */
const BGM={nodes:null,mode:'calm',timer:null,
  start(){
    if(!SFX.ctx||this.nodes||META.muted||META.bgm===false) return;
    try{const c=SFX.ctx,g=c.createGain();g.gain.value=0;g.connect(SFX.master);g.gain.linearRampToValueAtTime(.32,c.currentTime+4);
      const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=380;lp.Q.value=4;lp.connect(g);
      const oscs=[55,82.41,110.3].map((f,i)=>{const o=c.createOscillator();o.type=i===2?'triangle':'sawtooth';o.frequency.value=f;o.detune.value=(i-1)*8;const og=c.createGain();og.gain.value=i===2?.05:.07;o.connect(og);og.connect(lp);o.start();return o});
      const lfo=c.createOscillator();lfo.frequency.value=.06;const lg=c.createGain();lg.gain.value=160;lfo.connect(lg);lg.connect(lp.frequency);lfo.start();
      this.nodes={g,lp,oscs,lfo};this.set(this.mode);this.loop()}catch(e){this.nodes=null}
  },
  loop(){
    clearTimeout(this.timer);if(!this.nodes) return;
    const boss=this.mode==='boss',scale=[0,3,5,7,10,12,15],base=boss?110:220,f=base*Math.pow(2,pick(scale)/12);
    try{SFX.tone(f,2.8,'sine',.04,null,0,this.nodes.g);SFX.tone(f*2.01,1.9,'triangle',.014,null,.02,this.nodes.g);
      if(boss){SFX.tone(58,.3,'sine',.3,32,0,this.nodes.g);SFX.tone(58,.3,'sine',.22,32,.3,this.nodes.g)}}catch(e){}
    this.timer=setTimeout(()=>this.loop(),boss?1250:rnd(1900,3800));
  },
  set(m){this.mode=m;if(this.nodes){const c=SFX.ctx;this.nodes.lp.frequency.setTargetAtTime(m==='boss'?760:m==='combat'?520:360,c.currentTime,1.2);clearTimeout(this.timer);this.timer=setTimeout(()=>this.loop(),600)}},
  stop(){if(!this.nodes) return;const n=this.nodes;this.nodes=null;clearTimeout(this.timer);try{n.g.gain.setTargetAtTime(0,SFX.ctx.currentTime,.4);setTimeout(()=>{n.oscs.forEach(o=>o.stop());n.lfo.stop();n.g.disconnect()},2500)}catch(e){}}
};

function upgradedDef(d){

  if(s.pow&&s.pow.m) s.pow={m:s.pow.m+2};

/* ---------- scoring (shared by PvE + PvP) ---------- */
function detectHand(P){
  const cards=P.filter(p=>p.s.t!=='crs');if(!cards.length) return 'high';
  const ec={};cards.forEach(p=>ec[p.el]=(ec[p.el]||0)+1);const cnt=Object.values(ec).sort((a,b)=>b-a);cnt.push(0,0);
  const atk=cards.filter(p=>p.s.t==='atk').length,costs=new Set(cards.map(p=>Math.min(3,p.s.c)));
  if(cnt[0]>=5) return 'royal';
  if([0,1,2,3].every(c=>costs.has(c))) return 'grand';
  if(atk>=4) return 'four';
  if(cnt[0]>=3&&cnt[1]>=2) return 'full';
  if(cnt[0]>=3) return 'flush';
  if((costs.has(0)&&costs.has(1)&&costs.has(2))||(costs.has(1)&&costs.has(2)&&costs.has(3))) return 'straight';
  if(atk>=3) return 'three';
  if(cnt[0]>=2&&cnt[1]>=2) return 'twopair';
  if(cnt[0]>=2) return 'pair';
  return 'high';
}
const handBase=(h,lv)=>({ch:HANDS[h].ch+HANDS[h].lc*(lv-1),m:HANDS[h].m+HANDS[h].lm*(lv-1)});
function pasSum(alive,k){return alive.reduce((a,h)=>{const p=HERO_MAP[h.id].pas;return a+(p.k===k?(p.n||0):0)},0)}
function computeScore(o){
  const steps=[],P=o.played,hand=detectHand(P),lv=(o.handLv&&o.handLv[hand])||1,b=handBase(hand,lv),B=o.blinds||[];
  let chips=b.ch,mult=B.includes('eclipse')?1:b.m;steps.push({k:'hand',ch:b.ch,m:mult,x:1,chips,mult});
  const judge=B.includes('judge'),alive=o.heroes.filter(h=>!h.dead),ub=o.ub||null;
  const atkC=pasSum(alive,'atkChips'),firstC=pasSum(alive,'firstChips'),backC=pasSum(alive,'backChips');
  P.forEach((p,i)=>{
    const s=p.s,ow=p.owner&&!p.owner.dead?p.owner:null;let ch=(s.ch||0)+(p.rolls.chr||0)+(p.rolls.cb||0),m=s.m||0,x=s.x||1;
    if(p.rolls.xr) x*=p.rolls.xr;
    if(s.t==='atk'){
      if(ow&&ow.st) ch+=(ow.st.str||0)*4;ch+=atkC;if(p.tgtRank>=3) ch+=backC;if(ub&&ub.atkCh) ch+=ub.atkCh;
      if(ow&&ow.aff==='abusive') ch=Math.round(ch*1.5);if(ow&&ow.st&&ow.st.wk>0) ch=Math.round(ch*.75);
    }
    if(i===0) ch+=firstC;
    if(ow&&ow.aff==='masochistic') m+=4;
    if(s.exe&&p.tgtObj&&p.tgtObj.hp<p.tgtObj.maxHp/2) x*=2;
    if(p.inst.ed&&!judge){if(p.inst.ed==='foil') ch+=50;if(p.inst.ed==='holo') m+=10;if(p.inst.ed==='poly') x*=1.5}
    chips+=ch;mult+=m;mult*=x;p.given=ch;
    steps.push({k:'card',i,ch,m,x,chips,mult});
  });
  alive.forEach(h=>{
    const pas=HERO_MAP[h.id].pas;let ch=0,m=0,x=1;
    switch(pas.k){
      case 'elMult': m=pas.n*P.filter(p=>p.el===pas.el).length;break;
      case 'blockChips': ch=h.block||0;break;
      case 'stressAura': if(pas.low) m=alive.filter(a=>a.stress<30).length;break;
      case 'debuffMult': {const t=o.primary;if(t) m=pas.n*['bl','wk','vu','stun'].filter(k=>t.st[k]>0).length;break}
      case 'xFlush': if(['flush','full','royal'].includes(hand)) x=pas.x;break;
      case 'lowHpX': if(h.hp<h.maxHp/2) x=pas.x;break;
      case 'moveMult': m=pas.n*(h.moves||0);break;
      case 'handX': if(pas.hands.includes(hand)) x=pas.x;break;
      case 'ultCharge': m=pas.n*alive.filter(a=>(a.ult||0)>=100).length;break;
      case 'cardCountChips': ch=pas.n*P.length;break;
      case 'gamble': if(P.some(p=>p.s.xr||p.s.chr)) x=1.5;else if(P.length) m=3;break;
    }
    if(ch||m||x!==1){chips+=ch;mult+=m;mult*=x;steps.push({k:'hero',id:h.id,ch,m,x,chips,mult})}
  });
  if(o.powersM){mult+=o.powersM;steps.push({k:'power',ch:0,m:o.powersM,x:1,chips,mult})}
  if(ub&&(ub.ch||ub.m||ub.x!==1)){chips+=ub.ch||0;mult+=ub.m||0;mult*=ub.x||1;steps.push({k:'ult',ch:ub.ch||0,m:ub.m||0,x:ub.x||1,chips,mult})}
  alive.filter(h=>h.vir).forEach(h=>{mult*=3;steps.push({k:'virtue',id:h.id,ch:0,m:0,x:3,chips,mult})});
  if(!o.noRelics){
    const rel=o.relics,order=rel.map((r,i)=>i);if(B.includes('mirror')) order.reverse();
    const base={played:P.map(p=>({el:p.el,atk:p.s.t==='atk'})),hand,handLv:lv,heroes:o.heroes,energyLeft:o.energyLeft||0,turn:o.turn||1,releaseNo:o.releaseNo||1,
      runReleases:o.runReleases||0,gold:o.gold||0,deckSize:o.deckSize||0,ante:o.ante||1,relicCount:rel.length,frb:P.some(p=>p.s.frb),atkCount:P.filter(p=>p.s.t==='atk').length,
      sklCount:P.filter(p=>p.s.t==='skl').length,zeroCount:P.filter(p=>p.s.c===0).length,kills:o.kills||0,enemiesAlive:o.enemiesAlive||0,
      ultReady:alive.filter(h=>(h.ult||0)>=100).length,ultUsed:!!o.ultUsed,distinctEl:new Set(P.map(p=>p.el)).size};
    order.forEach((ix,n)=>{

      if(ch||m||x!==1){chips+=ch;mult+=m;mult*=x;steps.push({k:'relic',idx:ix,n,ch,m,x,chips,mult})}
    });

}

function makeEnemy(id,kind){

  if(d.elite){if(A(3)) m*=1.15;if(A(18)) m*=1.25}
  if(d.boss){if(A(7)) m*=1.2;if(A(20)&&act>=3) m*=1.5}

}
function chooseIntent(e){
  const d=ENEMIES[e.id],cyc=e.p2&&d.cyc2?d.cyc2:d.cyc;

function whyNot(inst){

  $('#sChips').textContent='0';$('#sMult').textContent='0';$('#sTotal').textContent='0';setFlame(0);
}
function updatePreview(){
  if(!C.played.length){resetScoreBox();return}
  const r=computeScore(Object.assign(scoreArgs(),{noRelics:true}));
  $('#hName').textContent=HANDS[r.hand].n;$('#hLv').textContent=`Lv.${r.lv} · ยังไม่รวมเรลิก`;
  $('#sChips').textContent=fmtS(r.chips);$('#sMult').textContent=fmtS(r.mult);$('#sTotal').textContent=fmtS(r.total);
}
function bump(id,txt){const el=$(id);el.textContent=txt;el.classList.remove('bump');void el.offsetWidth;el.classList.add('bump')}
async function animateScore(res){
  const mini=$$('#playedRow .mini'),scoreP=gpos($('#scoreBox'));
  $('#hName').textContent=HANDS[res.hand].n;$('#hLv').textContent=`Lv.${res.lv}`;
  let relicN=0;
  for(const st of res.steps){
    let src=null,col='#fff',label='';
    if(st.k==='hand'){label=HANDS[res.hand].n}
    else if(st.k==='card'){src=mini[st.i];mini.forEach(m=>m.classList.remove('lit'));if(src) src.classList.add('lit')}
    else if(st.k==='hero'||st.k==='virtue'){const h=RUN.heroes.find(x=>x.id===st.id);src=unitEl('h',h);if(src){src.classList.add('act');setTimeout(()=>src.classList.remove('act'),300)}label=st.k==='virtue'?'คุณธรรม ×3':HERO_MAP[st.id].name}
    else if(st.k==='relic'){src=document.querySelector(`.rslot[data-i="${st.idx}"]`);if(src){src.classList.remove('fire');void src.offsetWidth;src.classList.add('fire');const tg=src.querySelector('.trig');if(tg){tg.textContent=st.x!==1?'×'+(+st.x.toFixed(2)):st.m?'+'+fmtS(st.m)+' Mult':'+'+fmtS(st.ch);tg.style.background=st.x!==1||st.m?'#ff3d3d':'#2fd3ff';tg.style.color=st.x!==1||st.m?'#fff':'#001826'}}SFX.play('chime',relicN++)}
    else if(st.k==='power'){label='พลังถาวร'}else if(st.k==='blind'){label='ตาชั่งแห่งบาป ÷2'}else if(st.k==='ult'){label='ท่าไม้ตาย'}else if(st.k==='mod'){label='ร่างแก้ว ×2'}
    if(st.ch) {bump('#sChips',fmtS(st.chips));if(st.k!=='relic') SFX.play('tick',Math.min(12,relicN+2))}
    if(st.m||st.x!==1){bump('#sMult',fmtS(st.mult));if(st.k!=='relic') SFX.play(st.x!==1?'xmult':'mult',Math.min(10,relicN))}
    if(!st.ch&&!st.m&&st.x===1){bump('#sChips',fmtS(st.chips));bump('#sMult',fmtS(st.mult))}
    const p=src?gpos(src):scoreP;
    if(st.ch) fxFloat(p.x,p.y-14,'+'+fmtS(st.ch),'#2fd3ff',15);
    if(st.m) fxFloat(p.x,p.y-(st.ch?30:14),'+'+fmtS(st.m)+' Mult','#ff5a4a',15);
    if(st.x!==1) fxFloat(p.x,p.y-30,'×'+(+st.x.toFixed(2)),'#ff3d3d',st.x>=2?22:17);
    if(label&&st.k!=='hand') fxFloat(p.x,p.y+18,label,'#ece3cf',11);
    setFlame(st.chips*st.mult);
    await wait(st.k==='hand'?320:230);
  }
  mini.forEach(m=>m.classList.remove('lit'));
  const start=performance.now(),dur=SKIP?0:560/META.speed;
  await new Promise(r=>{const f=()=>{const k=dur?Math.min(1,(performance.now()-start)/dur):1,e=1-Math.pow(1-k,3);$('#sTotal').textContent=fmtS(res.total*e);if(k<1) requestAnimationFrame(f);else r()};f()});
  bump('#sTotal',fmtS(res.total));setFlame(res.total);
  if(res.total>=1e5){SFX.play('big');shakeGame()}
  if(res.total>META.best.hit){META.best.hit=res.total}
  if(RUN&&res.total>(RUN.bestHit||0)) RUN.bestHit=res.total;
}
async function release(){
  if(!C||C.busy||C.over) return;
  C.busy=true;C.sel=null;renderCombat();
  if(C.played.length){
    C.releaseNo++;RUN.releases=(RUN.releases||0)+1;
    const args=scoreArgs();args.releaseNo=C.releaseNo;args.runReleases=RUN.releases;
    const res=computeScore(args);
    await animateScore(res);
    await dealRelease(res,args.primary);
    if(relicCount('fang')) aliveHeroes().forEach(h=>healHero(h,2*relicCount('fang')));
    if(relicCount('backheart')) aliveHeroes().forEach(h=>addStress(h,3*relicCount('backheart')));
    const hr=pasSum(aliveHeroes(),'healRelease');if(hr) aliveHeroes().forEach(h=>healHero(h,hr));
    if(relicCount('moonwell')) aliveHeroes().forEach(h=>h.stress>0&&addStress(h,-3*relicCount('moonwell')));
    {const ur=6+pasSum(aliveHeroes(),'ultRelease');aliveHeroes().forEach(h=>addUlt(h,ur))}
    if(C.enemies.every(e=>e.dead)){await onVictory();return}
  }else log('ไม่ได้เล่นการ์ด — ไม่มีการปลดปล่อย');
  aliveHeroes().forEach(h=>{if(h.st.wk>0) h.st.wk--;if(h.st.vu>0) h.st.vu--});
  C.hand.forEach(c=>{if(c.id==='x_whisper'){const h=pick(aliveHeroes());if(h) addStress(h,6)}});
  C.discard.push(...C.hand,...C.playedPile);C.hand=[];C.playedPile=[];C.played=[];
  renderCombat();
  await processResolves();if(checkDefeat()) return;
  await wait(250);
  await enemyTurn();
}
async function dealRelease(res,primary){
  const P=C.played,atks=P.filter(p=>p.s.t==='atk'),total=res.total;
  const plan=[];
  if(!atks.length){if(primary) plan.push({e:primary,d:total,carry:1,el:P[0]?P[0].el:'void'})}
  else{
    const sum=atks.reduce((a,p)=>a+Math.max(1,p.given||0),0);
    atks.forEach(p=>{
      const share=total*Math.max(1,p.given||0)/sum;
      if(p.s.aoe){const tg=C.enemies.filter((e,i)=>!e.dead&&(p.s.rch||ANY).includes(i+1));tg.forEach(e=>plan.push({e,d:share*.7,el:p.el}))}
      else{let t=C.enemies.find(e=>e.uid===p.tgt&&!e.dead)||reachOf(p.s)[0]||C.enemies.find(e=>!e.dead);if(t) plan.push({e:t,d:share,carry:1,el:p.el})}
    });
  }
  const merged=[];plan.forEach(x=>{const m=merged.find(y=>y.e===x.e&&!!y.carry===!!x.carry);if(m) m.d+=x.d;else merged.push(Object.assign({},x))});
  const from=gpos($('#scoreBox'));
  for(const hit of merged){
    let e=hit.e,d=hit.d;
    while(e&&d>0.5){
      const el=unitEl('e',e);const p=el?gpos(el):from,col=ELEMENTS[hit.el].c;
      fxSlash(from.x,from.y+20,p.x,p.y,col);await wait(90);
      const before=e.hp;const over=dealEnemy(e,d);const dealt=before-e.hp;
      fxBurst(p.x,p.y,col,dealt>e.maxHp*.5?30:14,dealt>e.maxHp*.5?260:170);
      fxFloat(p.x,p.y-10,fmtS(Math.round(d*(e.st.vu>0?1.5:1))),'#ffe0a0',d>=1e4?26:20);
      SFX.play(d>=1e4?'big':'hit');if(el){el.classList.remove('hitk');void el.offsetWidth;el.classList.add('hitk')}
      if(e.dead){fxFloat(p.x,p.y+16,'สังหาร!','#ff3d3d',16);RUN.kills=(RUN.kills||0)+1;META.stats.kills++}
      renderRanks();
      await wait(160);
      if(!hit.carry) break;
      d=over;if(d<=0.5) break;e=C.enemies.find(x=>!x.dead&&!x.p2pend&&enemyRank(x)>enemyRank(e))||C.enemies.find(x=>!x.dead&&!x.p2pend);
    }
  }
  await checkPhase();
  C.enemies=C.enemies.filter(e=>!e.dead);
  if(!C.enemies.find(e=>e.uid===C.target)&&C.enemies[0]) C.target=C.enemies[0].uid;
  renderCombat();
}
function pickHeroTarget(rch){
  const alive=aliveHeroes();if(!alive.length) return null;
  const inR=alive.filter(h=>(rch||ANY).includes(heroRank(h)));
  const taunt=(inR.length?inR:alive).find(h=>h.taunt);if(taunt) return taunt;
  return inR.length?pick(inR):alive[0];
}
async function enemyTurn(){
  for(const e of C.enemies.slice()){
    if(C.over||e.dead) continue;
    if(!aliveHeroes().length) break;
    const el=unitEl('e',e);
    e.block=0;
    if(e.st.bl>0){const before=e.hp;dealEnemy(e,e.st.bl);floatAt(el,'🩸-'+Math.round(before-e.hp),'#ff6b80',14);e.st.bl--;if(e.p2pend){await checkPhase();continue}if(e.dead){C.enemies=C.enemies.filter(x=>!x.dead);renderCombat();if(!C.enemies.length){await onVictory();return}continue}}
    if(e.st.stun>0){e.st.stun=0;floatAt(el,'💫 สตัน','#ffe066',15);await wait(350);chooseIntent(e);continue}
    if(el){el.classList.add('act')}
    const it=e.intent;await wait(260);
    switch(it.k){
      case 'atk':{
        const tgt=pickHeroTarget(it.rch);const hits=it.h||1;
        for(let k=0;k<hits&&tgt&&!tgt.dead;k++){
          let d=enemyDmg(e,it.d);const crit=Math.random()<.1;if(crit) d=Math.round(d*1.5);
          const te=unitEl('h',tgt);if(el&&te){const a=gpos(el),b=gpos(te);fxSlash(a.x,a.y,b.x,b.y,'#ff3d3d')}
          SFX.play('enemy');damageHero(tgt,d,{crit});if(crit){floatAt(te,'คริติคอล!','#ffb04a',14);addStress(tgt,10)}
          renderRanks();await wait(200);
        }
        log(`${e.name} โจมตี ${tgt?HERO_MAP[tgt.id].name:''}`);break}
      case 'stress':{const ts=it.all?aliveHeroes():[pick(aliveHeroes())];ts.forEach(h=>addStress(h,it.n));SFX.play('stress');log(`${e.name} กระซิบความบ้าคลั่ง`);break}
      case 'debuff':{const ts=it.all?aliveHeroes():[pickHeroTarget(it.rch)];ts.forEach(h=>{if(!h) return;if(it.bl) h.st.bl+=it.bl;if(it.wk) h.st.wk+=it.wk;if(it.vu) h.st.vu+=it.vu;floatAt(unitEl('h',h),'☠','#c38bff',16)});log(`${e.name} สาปแช่ง`);break}
      case 'buff':{(it.all?C.enemies:[e]).forEach(x=>{x.st.str+=it.str;floatAt(unitEl('e',x),'💪+'+it.str,'#ffb04a',14)});log(`${e.name} เพิ่มพลัง`);break}
      case 'guard':{const v=Math.round(it.n*hpMul(RUN.act));(it.all?C.enemies:[e]).forEach(x=>{x.block+=v;floatAt(unitEl('e',x),'🛡+'+fmtS(v),'#8fb4dc',14)});SFX.play('block');break}
      case 'heal':{const v=Math.round(it.n*hpMul(RUN.act));(it.all?C.enemies:[e]).forEach(x=>{x.hp=Math.min(x.maxHp,x.hp+v);floatAt(unitEl('e',x),'+'+fmtS(v),'#6dff9a',14)});SFX.play('heal');break}
      case 'shuffle':{const al=aliveHeroes();if(al.length>1){const a=ri(0,al.length-1);let b=ri(0,al.length-1);if(a===b) b=(a+1)%al.length;const ha=al[a],hb=al[b],ia=RUN.heroes.indexOf(ha),ib=RUN.heroes.indexOf(hb);RUN.heroes[ia]=hb;RUN.heroes[ib]=ha;al.forEach(h=>addStress(h,5));log(`${e.name} บิดเบือนตำแหน่งของทีม!`);SFX.play('step')}break}
    }
    if(el) el.classList.remove('act');
    if(e.st.wk>0) e.st.wk--;if(e.st.vu>0) e.st.vu--;
    chooseIntent(e);
    renderCombat();
    await processResolves();
    if(checkDefeat()) return;
    await wait(220);
  }
  if(C.over) return;
  startTurn();
}
function checkDefeat(){
  if(!aliveHeroes().length&&C&&!C.over){C.over=true;setTimeout(()=>runEnd(false),900);return true}
  return false;
}
async function onVictory(){
  if(C.over) return;C.over=true;C.busy=true;
  SFX.play('win');setFlame(0);
  aliveHeroes().forEach(h=>{h.vir=null});
  RUN.heroes.forEach(h=>{delete h.block;delete h.st;delete h.taunt;delete h.moves});
  await cutScene('virtue',`<div class="cut-k" style="color:#3a2400">ชัยชนะ</div><div class="cut-t" style="color:#fff6d8">${C.kind==='boss'?'บอสล่มสลาย!':C.kind==='elite'?'ชั้นยอดถูกโค่น!':'ผ่านพ้น'}</div>`,1100);
  const kind=C.kind;C=null;
  onCombatWin(kind);
}

/* ---------- auto-play AI ---------- */
function estimateTotal(extra){
  const save=C.played;C.played=save.concat(extra);const r=computeScore(Object.assign(scoreArgs(),{noRelics:false}));C.played=save;return r.total;
}
async function autoPlay(){
  if(!C||C.over) return;
  await wait(250);
  let guard=0;
  while(META.auto&&C&&!C.over&&!C.busy&&guard++<12){
    const rdy=aliveHeroes().find(h=>(h.ult||0)>=100);if(rdy){await useUlt(rdy);await wait(150);continue}
    const playable=C.hand.filter(c=>!whyNot(c));if(!playable.length) break;
    const incoming=C.enemies.reduce((a,e)=>a+(e.intent&&e.intent.k==='atk'?enemyDmg(e,e.intent.d)*(e.intent.h||1):0),0);
    const blockNow=aliveHeroes().reduce((a,h)=>a+h.block,0);
    let best=null,bestV=-1;
    for(const c of playable){
      const s=cardDef(c);const fake={inst:c,s,el:cardEl(c),cost:cardCost(c),owner:cardOwner(c),tgt:C.target,rolls:{chr:s.chr?(s.chr[0]+s.chr[1])/2:0,xr:s.xr?(s.xr[0]+s.xr[1])/2:0,cb:s.cb?(effOwner(c)||{}).block||0:0}};
      let v=estimateTotal([fake])/(Math.max(1,fake.cost)+.5);
      if((s.blk||s.blkA)&&incoming>blockNow) v*=2.2;
      if(s.st&&aliveHeroes().some(h=>h.stress>70)) v*=.4;
      if(s.sh&&aliveHeroes().some(h=>h.stress>50)) v*=1.8;
      if(v>bestV){bestV=v;best=c}
    }
    if(!best) break;
    C.sel=best.uid;renderHand();await wait(220);
    await playCard(best.uid);await wait(180);
  }
  if(META.auto&&C&&!C.over&&!C.busy) release();
}

/* ---------- rendering ---------- */
function log(t){const el=$('#alog');if(el) el.textContent=t}
function intentHTML(e){
  const it=e.intent;if(!it) return '';
  switch(it.k){
    case 'atk': return `<span class="e">⚔️</span><span style="color:#ff8a8a">${enemyDmg(e,it.d)}${(it.h||1)>1?'×'+it.h:''}</span>`;
    case 'stress': return `<span class="e">🧠</span><span style="color:#d7cbff">${it.n}${it.all?'⁺':''}</span>`;
    case 'debuff': return `<span class="e">☠️</span>`;
    case 'buff': return `<span class="e">⬆️</span>`;
    case 'guard': return `<span class="e">🛡️</span>`;
    case 'heal': return `<span class="e">💚</span>`;
    case 'shuffle': return `<span class="e">🔀</span>`;
  }
  return '';
}
function stsHTML(st,extra=''){
  if(!st) return extra;
  const p=[];if(st.bl) p.push(`<span style="color:#ff6b80">🩸${st.bl}</span>`);if(st.wk) p.push(`<span style="color:#9fd">⬇${st.wk}</span>`);
  if(st.vu) p.push(`<span style="color:#ffb04a">💔${st.vu}</span>`);if(st.str) p.push(`<span style="color:#ffe066">💪${st.str}</span>`);if(st.stun) p.push('<span>💫</span>');
  return p.join('')+extra;
}
function unitHTML(u,side,i,o={}){
  if(!u) return `<div class="unit" style="opacity:.25"><div class="intent"></div><div class="pt" style="border:1px dashed var(--line);background:transparent"></div></div>`;
  const isH=side==='h',def=isH?HERO_MAP[u.id]:ENEMIES[u.id];
  const hpP=clamp(u.hp/u.maxHp*100,0,100),cls=[u.dead?'dead':'',o.tgt?'tgt':'',o.reach?'reach':'',o.owner?'owner':'',isH&&!u.dead&&(u.ult||0)>=100?'ultok':''].join(' ');
  let tag='';if(isH){if(u.vir) tag=`<span class="tagv v">${VIRTUES[u.vir].n}</span>`;else if(u.aff) tag=`<span class="tagv a">${AFFLICTIONS[u.aff].n}</span>`;else if(!u.dead&&u.hp<=0) tag='<span class="tagv dd">ประตูมรณะ</span>'}
  return `<button class="unit ${cls}" data-act="unit" data-side="${side}" data-i="${i}" aria-label="${esc(isH?def.name:def.n)}">
    <div class="intent">${!isH&&!u.dead?intentHTML(u):isH&&u.taunt?'<span class="e">🎯</span>':''}</div>
    <div class="pt ${isH?'fr-'+def.rar:''}">${isH?heroSVG(def):enemySVG(u.id)}<span class="rk">${i+1}</span>${u.block>0?`<span class="blk">${fmtS(u.block)}</span>`:''}${tag}</div>
    <div class="bar hp"><i style="width:${hpP}%"></i></div>
    ${isH?`<div class="bar st ${u.stress>=70?'hi':''}"><i style="width:${Math.min(100,u.stress)}%"></i></div><div class="bar ul"><i style="width:${Math.min(100,u.ult||0)}%"></i></div>`:''}
    <div class="hpn">${fmtS(u.hp)}${isH?'/'+fmtS(u.maxHp):''}</div>
    <div class="sts">${stsHTML(u.st)}</div>
  </button>`;
}
function renderRanks(){
  if(!C) return;
  const sel=C.sel?C.hand.find(c=>c.uid===C.sel):null,ss=sel?cardDef(sel):null;
  const reach=ss&&needsTarget(ss)?reachOf(ss):[],own=sel?cardOwner(sel):null;
  let h='';
  for(let r=3;r>=0;r--){const u=RUN.heroes[r];h+=unitHTML(u,'h',r,{owner:u&&own===u})}
  h+='<div class="divider"></div>';
  for(let r=0;r<4;r++){const e=C.enemies[r];h+=unitHTML(e,'e',r,{tgt:e&&e.uid===C.target,reach:e&&reach.includes(e)})}
  $('#ranks').innerHTML=h;
  const ub=$('#ultbar');if(ub) ub.innerHTML=C.over?'':aliveHeroes().filter(x=>(x.ult||0)>=100).map(x=>{const d=HERO_MAP[x.id];return `<button class="ultbtn" data-act="ult" data-id="${x.id}" ${C.busy?'disabled':''} aria-label="ท่าไม้ตาย ${esc(d.name)}"><span class="art">${heroSVG(d)}</span>ULT</button>`}).join('');
}
function renderRack(){
  const slots=5+RUN.relics.filter(r=>r.ed==='neg').length;let h='';

    const r=RUN.relics[i];
    if(!r){h+='<div class="rslot"></div>';continue}
    const R=RELICS[r.id],RR=RELIC_RAR[R.r];
    h+=`<button class="rslot has" data-act="relic-info" data-i="${i}" style="--rc1:${RR.c1};--rc2:${RR.c2}" aria-label="${esc(R.n)}"><span class="g">${R.i}</span>${r.ed?`<span class="ed ed-${r.ed}"></span>`:''}<span class="trig"></span></button>`;
  }
  $('#rack').innerHTML=h;
}
function renderHand(){
  if(!C) return;
  const hz=$('#hand'),n=C.hand.length,W=hz.clientWidth||320,cw=$('#handzone').querySelector('.card')?parseFloat(getComputedStyle($('#handzone').querySelector('.card')).width):76;
  const spread=n>1?Math.min(cw*.8,(W-cw-26)/(n-1)):0,rotK=n>5?2.4:3.6;
  hz.innerHTML=C.hand.map((inst,i)=>{
    const off=i-(n-1)/2,sel=C.sel===inst.uid,why=whyNot(inst),cost=cardCost(inst);
    const tr=sel?`translate(${off*spread}px,-34px) scale(1.16)`:`translate(${off*spread}px,${Math.abs(off)*Math.abs(off)*2.2}px) rotate(${off*rotK}deg)`;
    return cardHTML(inst,{cls:(sel?'sel ':'')+(why?'nope':''),attrs:`data-act="card" style="transform:${tr};z-index:${sel?50:i+1}"`,cost,costCls:cost>CARDS[inst.id].c?'bad':''});
  }).join('');
  $('#playedRow').innerHTML=C.played.map(p=>{const E=ELEMENTS[p.el];return `<span class="mini" style="--elc:${E.c};--elc2:${E.c2}">${E.i}</span>`}).join('');
  const det=$('#cdetail'),sel=C.sel&&C.hand.find(c=>c.uid===C.sel);
  if(sel){
    const s=cardDef(sel),why=whyNot(sel),ow=cardOwner(sel);
    det.innerHTML=`<div class="inner"><div class="grow"><div style="font-weight:700">${esc(s.n)}${sel.up?'+':''} <span class="muted" style="font-size:11px">${s.frb?'ต้องห้าม':TYPE_N[s.t]} · ${ELEMENTS[cardEl(sel)].n}${ow?' · '+esc(HERO_MAP[ow.id].name):''}</span></div>

function genMap(){return RUN.mode==='daily'?withSeed((RUN.seed||1)+RUN.act*7919,genMap0):genMap0()}
function genMap0(){
  const rows=Array.from({length:ROWS},()=>[null,null,null,null]);
  const starts=shuffle([0,1,2,3]).slice(0,3);starts.push(pick([0,1,2,3]));
  starts.forEach(c0=>{
    let c=c0;
    for(let r=0;r<ROWS;r++){
      if(!rows[r][c]) rows[r][c]={r,c,t:null,next:[],jx:rnd(-.08,.08),done:false};
      if(r<ROWS-1){let nc=clamp(c+ri(-1,1),0,3);if(!rows[r][c].next.includes(nc)) rows[r][c].next.push(nc);c=nc}
    }
  });
  const eliteW=hasMod('elite')?42:A(1)?20:13;
  rows.forEach((row,r)=>row.forEach(n=>{
    if(!n) return;
    if(r===0) n.t='combat';
    else if(r===ROWS-1) n.t='camp';
    else n.t=wpick([[46,'combat'],[22,'event'],[r>=2?eliteW:0,'elite'],[10,'shop'],[r>=2&&r<=4?8:0,'camp']]);
  }));
  const all=rows.flat().filter(Boolean);
  if(!all.some(n=>n.t==='shop')){const mids=all.filter(n=>n.r>=2&&n.r<=4);if(mids.length) pick(mids).t='shop'}
  if(!all.some(n=>n.t==='elite')){const mids=all.filter(n=>n.r>=2&&n.r<=5&&n.t==='combat');if(mids.length) pick(mids).t='elite'}
  const pool=RUN.act<=3?ACT_POOLS[RUN.act-1].boss:RUN.throne&&RUN.act===4?['b_king']:Object.keys(ENEMIES).filter(k=>ENEMIES[k].boss);
  return {rows,boss:pick(pool)};
}
function newRun(asc,o={}){

    handLv:{},removeCost:50,releases:0,kills:0,ults:0,bestHit:0,started:Date.now(),endless:false,throne:false,pos:null,map:null,shop:null,ev:null,actsCleared:0,gemsEarned:0,seenEv:[]};

  });
  RUN.heroes.forEach(h=>{const d=HERO_MAP[h.id];RUN.deck.push(mkCard(BASIC_BY_CLASS[d.cls],h.id),mkCard('b_guard',h.id),mkCard(d.cards[0],h.id),mkCard(d.cards[1],h.id));
    if(mods.includes('armory')) RUN.deck.push(mkCard(d.cards[3],h.id));if(RUN.mode==='rush') RUN.deck.push(mkCard(d.cards[2],h.id))});
  if(asc>=10) RUN.deck.push(mkCard('x_wound',null));
  if(mods.includes('cursed')){for(let i=0;i<3;i++) RUN.deck.push(mkCard(pick(CURSES),null));RUN.relics.push({id:pick(Object.keys(RELICS).filter(k=>RELICS[k].r==='mythic')),ed:null})}
  if(mods.includes('stars')) HAND_ORDER.forEach(h=>RUN.handLv[h]=3);

}

function drawMap(){
  const wrap=$('#mapwrap'),m=$('#map');if(!wrap) return;

  const pos=(n)=>n==='boss'?{x:W/2,y:52}:{x:((n.c+.5)/4+n.jx)*W,y:H-50-n.r*rowH};
  const avail=nextNodes();
  let lines='',nodes='';
  RUN.map.rows.forEach(row=>row.forEach(n=>{
    if(!n) return;const a=pos(n);
    const targets=n.r===ROWS-1?['boss']:n.next.map(c=>RUN.map.rows[n.r+1][c]);
    targets.forEach(t=>{if(!t) return;const b=pos(t);const walked=n.done&&(t==='boss'?RUN.pos&&RUN.pos.boss:t.done);
      lines+=`<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="${walked?'#e7b04b':'#4a3c57'}" stroke-width="${walked?3:2}" stroke-dasharray="${walked?'':'4 6'}"/>`});
  }));
  RUN.map.rows.forEach(row=>row.forEach(n=>{
    if(!n) return;const p=pos(n),isNext=avail.includes(n),isCur=RUN.pos&&!RUN.pos.boss&&RUN.pos.r===n.r&&RUN.pos.c===n.c;
    nodes+=`<button class="node ${n.done?'done':''} ${isCur?'cur':''} ${isNext?'next':''}" style="left:${p.x}px;top:${p.y}px" data-act="node" data-r="${n.r}" data-c="${n.c}" ${isNext?'':'disabled'} aria-label="${NODE_N[n.t]}">${NODE_I[n.t]}</button>`;
  }));

  m.innerHTML=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${lines}</svg>${nodes}`;
  const focus=RUN.pos?(RUN.pos.boss?bp:pos(curNode())):{y:H};
  wrap.scrollTop=Math.max(0,focus.y-wrap.clientHeight*.65);
}

function rewardCard(exclude=[]){
  const hs=aliveHeroes().map(h=>HERO_MAP[h.id]);let id,tries=0;
  do{
    if(Math.random()<.18||!hs.length) id=pick(NEUTRAL_POOL);
    else{const h=pick(hs),r=Math.random(),tier=r<.12?'r':r<.45?'u':'c';let c=h.cards.filter(x=>(CARDS[x].r||'c')===tier);if(!c.length) c=h.cards;id=pick(c)}
  }while(exclude.includes(id)&&tries++<12);
  return mkCard(id,CARDS[id].hero||null,Math.random()<.06*RUN.act,rollEdition(.6));
}
function randomRelic(w=[55,32,13]){
  const own=RUN.relics.map(r=>r.id);
  const pool=Object.keys(RELICS).filter(k=>RELICS[k].r!=='mythic'&&!own.includes(k));
  const rar=wpick([[w[0],'common'],[w[1],'uncommon'],[w[2],'rare']]);
  let c=pool.filter(k=>RELICS[k].r===rar);if(!c.length) c=pool;
  return c.length?pick(c):'jester';
}

  gold+=pasSum(aliveHeroes(),'goldWin');
  RUN.gold+=gold;

function genShop(){
  const pm=priceMul(),cards=[],ex=[];
  for(let i=0;i<3;i++){const c=rewardCard(ex);ex.push(c.id);const r=CARDS[c.id].r||'c';cards.push({c,p:Math.round(({c:50,u:75,r:110}[r]+(c.ed?40:0))*pm)})}
  const relics=[];const ids=new Set();while(ids.size<3) ids.add(randomRelic([50,35,15]));
  ids.forEach(id=>relics.push({id,ed:rollEdition(.8),p:Math.round(RELIC_RAR[RELICS[id].r].price*pm*(A(19)?1.25:1))}));
  const hands=shuffle(HAND_ORDER.slice()).slice(0,2).map(h=>({h,p:Math.round((60+15*((RUN.handLv[h]||1)-1))*pm)}));
  return {cards,relics,hands,enchant:Math.round(100*pm),sold:{}};
}

function snapshotPower(sn){
  let p=0;sn.relics.forEach(r=>p+=({common:1,uncommon:2,rare:3,mythic:5}[RELICS[r.id].r]));
  p+=Object.values(sn.handLv).reduce((a,b)=>a+(b-1),0)*1.5;p+=sn.deck.filter(c=>c.up).length*.4;p+=sn.heroes.reduce((a,h)=>a+h.star*.8+RARITY[HERO_MAP[h.id].rar].rank,0);
  return Math.round(p*10);
}

    relics:RUN.relics.map(r=>({id:r.id,ed:r.ed})),handLv:Object.assign({},RUN.handLv),act:RUN.act,asc:RUN.asc};

}

function runEnd(win){
  if(!RUN) return;
  C=null;const r=RUN;
  const snap=r.act>=2||win;if(snap) makeSnapshot();
  const gems=Math.round((r.act-1)*60+(r.kills||0)*3);META.gems+=gems;r.gemsEarned=(r.gemsEarned||0)+gems;
  META.best.ante=Math.max(META.best.ante,r.act);
  META.stats.ults=(META.stats.ults||0)+(r.ults||0);
  let extra={};
  if(r.mode==='daily'){
    const key=r.dayKey||dayKey(),score=dailyScore(r,win),D=META.daily;if(D.key!==key){D.key=key;D.best=0}
    const isBest=score>D.best;D.best=Math.max(D.best,score);D.hist=(D.hist||[]).filter(x=>x.key!==key);D.hist.unshift({key,score:D.best});D.hist=D.hist.slice(0,7);
    let bonus=0;if(D.claimed!==key){bonus=150+100*Math.min(4,r.act)+(win?300:0);D.claimed=key;META.gems+=bonus;r.gemsEarned+=bonus}
    extra={mode:'daily',score,isBest,bonus};
  }
  if(r.mode==='rush'){META.rush.best=Math.max(META.rush.best||0,r.rush.i);extra={mode:'rush',stage:r.rush.i,total:RUSH.length}}
  const summary=Object.assign({win,act:r.act,asc:r.asc,kills:r.kills||0,releases:r.releases||0,gems:r.gemsEarned,snap,ults:r.ults||0,throne:!!r.throne,heroes:r.heroes.map(h=>({id:h.id,dead:h.dead}))},extra);
  RUN=null;saveRun();saveMeta();
  SFX.play(win?'win':'lose');
  RUNEND=summary;go('runend');
}

function weekKey(){const d=new Date(),y=d.getFullYear(),s=new Date(y,0,1);return y+'-W'+Math.ceil(((d-s)/864e5+s.getDay()+1)/7)}
function featuredUR(){const urs=HEROES.filter(h=>h.rar==='UR');const k=weekKey();let h=0;for(const ch of k) h=(h*31+ch.charCodeAt(0))>>>0;return urs[h%urs.length].id}

ACT.go=el=>go(el.dataset.s);
ACT['continue-run']=()=>continueRun();
function continueRun(){
  if(!RUN) return go('home');
  if(RUN.mode==='rush'){if(RUN.reward) return go('reward');return rushNext()}
  if(RUN.reward) return go('reward');
  if(RUN.pos&&!RUN.pos.boss){const n=curNode();if(n&&!n.done){
    if(n.t==='shop'&&RUN.shop) return go('shop');
    if(n.t==='event'&&RUN.ev) return go('event');
    if(n.t==='camp') return go('camp');
    RUN.pos=prevPos();
  }}else if(RUN.pos&&RUN.pos.boss){const d=RUN.map.rows[ROWS-1].find(x=>x&&x.done);RUN.pos=d?{r:d.r,c:d.c}:null}
  saveRun();go('map');
}

    <button class="btn blood xl" data-act="start-run" ${sq.length<4?'disabled':''}>ลงสู่หอคอย</button>`);
}

      }

        const gx=5,gy=8;for(let i=0;i<gx;i++)for(let j=0;j<gy;j++){const ax=x0+i*cw/gx,ay=y0+j*ch/gy,bw=cw/gx,bh=ch/gy;

    const o=pm.map(i=>ids[i]);let sc=0;
    o.forEach((id,i)=>{const d=HERO_MAP[id],pos=i+1;sc+=fitOf(id,pos)*10+(CLASSES[d.cls].pref.includes(pos)?3:0);if(pos===1) sc+=d.hp/30+(d.cls==='vanguard'?4:0)});
    if(sc>bs){bs=sc;best=o}
  });
  return {order:best,fit:bs};
}
const isSupport=d=>d.cls==='arbiter'||['stressAura','healRelease'].includes(d.pas.k);
function teamEval(ids,strat){
  const {order,fit}=orderTeam(ids),ds=order.map(id=>HERO_MAP[id]),pw=strat==='power',roleW=pw?.5:1;
  let sc=ds.reduce((a,d)=>a+heroPow(d.id),0)*({power:1.8,flush:.5,ult:.55}[strat]||1)+fit*(pw?.6:1);
  sc+=ds.some(d=>d.cls==='vanguard')?14*roleW:-14*roleW;
  if(ds.some(isSupport)) sc+=12*roleW;
  if(ds.filter(d=>['assassin','ranger','occultist'].includes(d.cls)).length>=2) sc+=8*roleW;
  const ec={};ds.forEach(d=>ec[d.el]=(ec[d.el]||0)+1);const top=Math.max(...Object.values(ec));
  sc+=(top-1)*(strat==='flush'?24:3)+(strat==='flush'&&top>=3?16:0);
  ds.forEach(d=>{if(d.pas.k==='elMult') sc+=(ec[d.pas.el]-1)*(strat==='flush'?7:3);if(d.pas.k==='xFlush'&&strat==='flush') sc+=10});
  if(strat==='ult') ds.forEach(d=>{const U=ULTS[d.id];if(d.pas.k==='ultCharge') sc+=30;if(d.pas.k==='ultRelease') sc+=22;sc+=d.cards.filter(c=>CARDS[c].uc).length*6;if(U.x||U.xr) sc+=8;if(U.dmgAll) sc+=7});
  return {ids:order,score:Math.round(sc),ec};
}
function autoTeam(strat){
  const own=Object.keys(META.owned).filter(id=>HERO_MAP[id]),n=own.length;if(n<4) return null;
  let best=null;
  for(let a=0;a<n;a++)for(let b=a+1;b<n;b++)for(let c=b+1;c<n;c++)for(let d=c+1;d<n;d++){
    const r=teamEval([own[a],own[b],own[c],own[d]],strat);if(!best||r.score>best.score) best=r;
  }
  return best;
}
function teamReasons(r){

  const el=Object.entries(r.ec).sort((a,b)=>b[1]-a[1])[0];
  if(el[1]>=2) out.push(`ธาตุ${ELEMENTS[el[0]].n} ${ELEMENTS[el[0]].i}×${el[1]} — ทำคู่ธาตุหรือฟลัชได้ง่าย`);

}

function withSeed(seed,fn){
  const orig=Math.random;let a=seed>>>0;
  Math.random=()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
  try{return fn()}finally{Math.random=orig}
}
function dayKey(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function hashStr(s){let h=2166136261;for(const ch of s){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function dailyConfig(key){
  key=key||dayKey();const seed=hashStr('abyss:'+key);
  return withSeed(seed,()=>{
    const hs=[],cls={};
    for(const h of shuffle(HEROES.slice())){if(hs.length>=4) break;if((cls[h.cls]||0)>=2) continue;cls[h.cls]=(cls[h.cls]||0)+1;hs.push(h)}
    if(!hs.some(h=>CLASSES[h.cls].pref.includes(1))) hs[3]=pick(HEROES.filter(h=>h.cls==='vanguard'&&!hs.includes(h)));
    hs.sort((a,b)=>CLASSES[a.cls].pref[0]-CLASSES[b.cls].pref[0]||CLASSES[a.cls].pref.length-CLASSES[b.cls].pref.length);
    const mods=shuffle(Object.keys(DAILY_MODS)).slice(0,2);
    const relic=pick(Object.keys(RELICS).filter(k=>RELICS[k].r==='rare'));
    return {key,seed,squad:hs.map(h=>h.id),mods,relic};
  });
}

const pvAlive=side=>side.heroes.filter(h=>!h.dead);
function pvRank(side,h){return pvAlive(side).indexOf(h)+1}
function pvChoose(side,round){
  const hand=shuffle(side.deck.slice()).slice(0,5);let energy=3;const played=[];
  const args=()=>({played,heroes:side.heroes,relics:side.relics,handLv:side.handLv,blinds:[],gold:0,energyLeft:energy,turn:round,releaseNo:round,runReleases:round*2,deckSize:side.deck.length,ante:3,powersM:0,primary:null,ub:side.ub});
  for(let g=0;g<6;g++){
    let best=null,bv=0;
    hand.forEach(inst=>{
      const s=cardDef(inst);if(s.t==='crs'||s.c>energy) return;
      const ow=inst.owner?side.heroes.find(h=>h.id===inst.owner):null;if(inst.owner&&(!ow||ow.dead)) return;
      if(ow&&!(s.rk||ANY).includes(pvRank(side,ow))) return;
      const e={inst,s,el:cardEl(inst),owner:ow,rolls:{chr:s.chr?(s.chr[0]+s.chr[1])/2:0,xr:s.xr?(s.xr[0]+s.xr[1])/2:0,cb:0},tgtRank:1};
      played.push(e);const v=computeScore(args()).total/(s.c+.6);played.pop();
      if(v>bv){bv=v;best=e}
    });
    if(!best) break;played.push(best);energy-=best.s.c;hand.splice(hand.indexOf(best.inst),1);
  }
  return {played,res:played.length?computeScore(args()):null};
}

async function runPvp(){

  while(PV&&!PV.over){
    PV.round++;

      PV.turn=k;const me=PV[k],foe=PV[k==='a'?'b':'a'];
      pvAlive(me).forEach(h=>{h.block=0;h.ult=Math.min(100,(h.ult||0)+20)});me.ub=null;
      const rdy=pvAlive(me).find(h=>h.ult>=100);
      if(rdy){rdy.ult=0;const U=ULTS[rdy.id],D=HERO_MAP[rdy.id];
        me.ub={ch:(U.ch||0)+(U.dmgAll||U.dmgP?60:0)+(U.chBlock?40:0),m:U.m||0,x:(U.x||1)*(U.xr?(U.xr[0]+U.xr[1])/2:1),atkCh:U.atkCh||0};
        if(U.hlAP) pvAlive(me).forEach(x=>x.hp=Math.min(x.maxHp,x.hp+Math.round(x.maxHp*U.hlAP)));
        if(U.hlP) rdy.hp=Math.min(rdy.maxHp,rdy.hp+Math.round(rdy.maxHp*U.hlP));

        if(!PV.skip) await ultCutIn(D);

      }
      const {played,res}=pvChoose(me,PV.round);
      played.forEach(p=>{const s=p.s,o=p.owner||pvAlive(me)[0];if(!o) return;
        if(s.blk) o.block+=s.blk;if(s.blkA) pvAlive(me).forEach(h=>h.block+=s.blkA);
        if(s.hl) o.hp=Math.min(o.maxHp,o.hp+s.hl);if(s.hlA) pvAlive(me).forEach(h=>h.hp=Math.min(h.maxHp,h.hp+s.hlA));

        for(const st of res.steps){if(PV.skip) break;$('#pvC').textContent=fmtS(st.chips);$('#pvM').textContent=fmtS(st.mult);if(st.k==='relic') SFX.play('chime',st.n);else SFX.play('tick',3);await wait(110)}
        $('#pvC').textContent=fmtS(res.chips);$('#pvM').textContent=fmtS(res.mult);bump('#pvT',fmtS(res.total));
        let dmg=Math.round(10*Math.pow(Math.log10(res.total+1),2));PV.log=`${k==='a'?'คุณ':'เงา'}ปลดปล่อย ${fmtS(res.total)} → ดาเมจวิญญาณ ${dmg}`;$('#pvLog').textContent=PV.log;
        while(dmg>0&&pvAlive(foe).length){
          const t=pvAlive(foe)[0];let d=dmg;if(t.block){const ab=Math.min(t.block,d);t.block-=ab;d-=ab}

        }

    }

  }
}

    <div class="list">${Object.entries(CODES).map(([k,v])=>`<button class="item" data-act="redeem" data-code="${k}" ${META.codes[k]?'disabled':''} style="text-align:left;${META.codes[k]?'opacity:.5':''}"><div class="glyph">🎁</div><div class="grow"><div class="t num" style="letter-spacing:.08em">${k}</div><div class="d">${META.codes[k]?'ใช้แล้ว ✓':v.d}</div></div></button>`).join('')}</div>
    <div class="row" style="flex-wrap:nowrap"><input type="text" id="codeIn" placeholder="พิมพ์โค้ด" autocomplete="off" style="text-transform:uppercase"><button class="btn chips" data-act="redeem-in">ใช้</button></div>`);
};
function redeem(code){
  code=(code||'').trim().toUpperCase();const c=CODES[code];
  if(!c){toast('ไม่พบโค้ดนี้','bad');return}
  if(META.codes[code]){toast('ใช้โค้ดนี้ไปแล้ว','bad');return}
  META.codes[code]=1;META.gems+=c.gems||0;META.tickets+=c.tickets||0;let extra='';
  if(c.ur){const r=grantHero(pick(HEROES.filter(h=>h.rar==='UR')).id);extra=` · ${HERO_MAP[r.id].name}${r.isNew?' (ใหม่!)':''}`;SFX.play('rUR')}
  if(c.newur){const r=grantHero(pick(['aurelia','nyx']));extra+=` · ${HERO_MAP[r.id].name}${r.isNew?' (ใหม่!)':''}`;SFX.play('rUR')}
  if(c.mythic){const r=grantRelicG(pick(Object.keys(RELICS).filter(k=>RELICS[k].r==='mythic')));extra+=` · ${RELICS[r.id].n}`;SFX.play('rUR')}
  saveMeta();SFX.play('coin');toast(`รับ ${c.d} แล้ว!${extra}`,'gold');ACT.codes();if(CUR==='home') RENDER.home();
}
ACT.redeem=el=>redeem(el.dataset.code);
ACT['redeem-in']=()=>redeem($('#codeIn').value);
ACT.settings=()=>{
  let code='';try{code=btoa(unescape(encodeURIComponent(JSON.stringify({meta:META,run:RUN}))))}catch(e){}
  showModal(`<div class="row between"><div class="h2">ตั้งค่า & เซฟ</div><button class="backbtn" data-act="close-modal" aria-label="ปิด">✕</button></div>
    <div class="row"><button class="btn" data-act="toggle-mute">${META.muted?'🔇 เปิดเสียง':'🔊 ปิดเสียง'}</button><button class="btn" data-act="toggle-bgm">${META.bgm===false?'🎵 เปิดเพลง':'🎵 ปิดเพลง'}</button><button class="btn" data-act="set-spd">ความเร็วอนิเมชัน ×${META.speed}</button></div>
    <div class="muted" style="font-size:12px">เกมบันทึกอัตโนมัติในเบราว์เซอร์นี้ทุกครั้งที่มีความคืบหน้า</div>
    <div class="h2" style="font-size:15px">ส่งออกเซฟ (Base64)</div><textarea id="expBox" readonly>${code}</textarea><button class="btn sm" data-act="copy-exp">คัดลอก</button>
    <div class="h2" style="font-size:15px">นำเข้าเซฟ</div><textarea id="impBox" placeholder="วางโค้ดเซฟที่นี่"></textarea><button class="btn gold sm" data-act="do-imp">นำเข้า</button>
    <div class="h2" style="font-size:15px;color:var(--afflict)">ล้างข้อมูล</div><button class="btn sm" data-act="reset-1">เริ่มใหม่ทั้งหมด</button>`);
};
ACT['toggle-bgm']=()=>{META.bgm=META.bgm===false;saveMeta();if(META.bgm===false) BGM.stop();else{SFX.init();BGM.start()}ACT.settings()};
ACT['set-spd']=()=>{META.speed=META.speed>1?1:2;saveMeta();ACT.settings()};
ACT['copy-exp']=()=>{const b=$('#expBox');const fb=()=>{b.focus();b.select();toast('เลือกข้อความแล้ว กดคัดลอกเอง')};try{navigator.clipboard.writeText(b.value).then(()=>toast('คัดลอกแล้ว','good'),fb)}catch(e){fb()}};
ACT['do-imp']=()=>{const v=$('#impBox').value.trim();if(!v){toast('วางโค้ดเซฟก่อน','bad');return}
  try{const o=JSON.parse(decodeURIComponent(escape(atob(v))));if(!o||!o.meta||!o.meta.owned) throw 0;META=mergeMeta(o.meta);RUN=o.run&&o.run.heroes?o.run:null;saveMeta();saveRun();closeModal();go('home');toast('นำเข้าเซฟสำเร็จ','good')}
  catch(e){toast('โค้ดเซฟไม่ถูกต้อง','bad')}};
ACT['reset-1']=el=>{el.dataset.act='reset-2';el.textContent='ยืนยัน: ลบความคืบหน้าทั้งหมด';el.classList.add('blood')};
ACT['reset-2']=()=>{META=defMeta();RUN=null;saveMeta();saveRun();closeModal();go('home');toast('เริ่มใหม่แล้ว')};

/* ---------- boot ---------- */
loadAll();
sizeFx();sizeAmb();
requestAnimationFrame(t=>{lastT=t;requestAnimationFrame(frame)});
go('home');
if(!META.seenIntro){META.seenIntro=true;META.seenV2=true;saveMeta();
  showModal(`<div class="t-title" style="font-size:24px;text-align:center;color:#ffe9ec;text-shadow:0 0 14px rgba(255,51,88,.8)">ABYSSAL ANTE</div>
    <div class="t-disp" style="text-align:center;font-size:16px">ยินดีต้อนรับสู่หอคอยแห่งความบ้าคลั่ง</div>
    <div class="list" style="font-size:12.5px">
      <div class="item"><div class="glyph">🃏</div><div class="grow">สร้างมือแบบโป๊กเกอร์ด้วยการ์ด แล้ว<b>ปลดปล่อย</b> ชิป × Mult ใส่ศัตรู</div></div>
      <div class="item"><div class="glyph">🧠</div><div class="grow">ระวังความเครียด ถึง 100 เมื่อไหร่ จิตใจจะแตกสลาย… หรือตื่นรู้</div></div>
      <div class="item"><div class="glyph">💥</div><div class="grow">ฮีโร่ทุกตัวมี<b>ท่าไม้ตาย</b> เกจเต็มแล้วแตะปุ่ม ULT บนสนามเพื่อปล่อยคัตอิน</div></div>
      <div class="item"><div class="glyph">🎁</div><div class="grow">โค้ดฟรี: BALATRO999 · DARKESTUR · SLAYSPIRE · OPUS55GOD · ABYSSTHRONE</div></div></div>
    <div class="row"><button class="btn gold grow" data-act="codes">รับโค้ดของขวัญ</button><button class="btn grow" data-act="close-modal">เริ่มเลย</button></div>`);
}else if(!META.seenV2){META.seenV2=true;saveMeta();ACT.patch()}
setInterval(()=>{saveMeta()},20000);
document.addEventListener('visibilitychange',()=>{if(document.hidden){saveMeta();saveRun();try{SFX.ctx&&SFX.ctx.suspend()}catch(e){}}else{try{SFX.ctx&&SFX.ctx.resume()}catch(e){}}});

</script>
